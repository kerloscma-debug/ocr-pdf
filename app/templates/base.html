<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ZATCA Portal{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f6fa}
.sidebar{width:220px;min-height:100vh;background:#1F3864;position:fixed;top:0;right:0}
.sidebar a{color:#cdd6e8;display:block;padding:12px 20px;text-decoration:none;font-size:.9rem}
.sidebar a:hover,.sidebar a.active{background:#2d4f8a;color:#fff}
.sidebar .logo{padding:20px;color:#fff;font-size:1.1rem;font-weight:700;border-bottom:1px solid #2d4f8a}
.main-content{margin-right:220px;padding:24px}
.badge-UPLOADED{background:#6c757d}.badge-PROCESSING{background:#0dcaf0}
.badge-REVIEWED{background:#ffc107;color:#000}.badge-EXPORTED{background:#198754}
.badge-PUSHED_ODOO{background:#0d6efd}
.badge-NOT_EXPORTED{background:#6c757d}.badge-READY{background:#ffc107;color:#000}
.badge-EXPORTED{background:#198754}.badge-ERROR{background:#dc3545}
.flag-ok{color:#198754}.flag-fail{color:#dc3545}.flag-warn{color:#ffc107}
.dup-row{background:#fff3cd !important}
.review-row{background:#ffe7e7 !important}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="sidebar">
  <div class="logo"><i class="bi bi-receipt-cutoff me-2"></i>ZATCA Portal</div>
  <a href="/upload" class="{% if request.url.path=='/upload' %}active{% endif %}">
    <i class="bi bi-upload me-2"></i>رفع ملف</a>
  <a href="/batches" class="{% if '/batches' in request.url.path %}active{% endif %}">
    <i class="bi bi-collection me-2"></i>الـ Batches</a>
  <a href="/exports" class="{% if request.url.path=='/exports' %}active{% endif %}">
    <i class="bi bi-cloud-upload me-2"></i>تتبع Odoo</a>
  <a href="/suppliers" class="{% if '/suppliers' in request.url.path %}active{% endif %}">
    <i class="bi bi-building me-2"></i>ذاكرة الموردين</a>
</div>
<div class="main-content">
{% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
